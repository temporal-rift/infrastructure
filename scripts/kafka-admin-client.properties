# Local/CI-only demo credential for compose.secure.yml's admin (super user) identity — never used
# outside that standalone stack. See compose.secure.yml for why SASL/PLAIN with a static,
# checked-in credential map is an acceptable choice for this demonstration only.
security.protocol=SASL_PLAINTEXT
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-local-demo-secret";
