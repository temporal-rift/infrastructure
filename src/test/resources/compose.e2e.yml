services:
  postgres:
    ports: !override []
    # Default postgres:16-alpine fsyncs and waits for the WAL to hit disk on every commit
    # (synchronous_commit=on). On a real SSD that's sub-millisecond; on shared/throttled CI
    # storage it can silently stall for seconds at a time under concurrent write load from three
    # services' Kafka consumers all committing at once -- with zero error logged, since it's not
    # a failure, just a slow fsync. This container holds only ephemeral e2e test data with no
    # durability requirement (torn down every run), so trading crash-safety for speed here is
    # safe in a way it would not be for any real deployment.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]

  kafka:
    # Exposed only for this e2e profile (never the shared dev compose.yml), on a dedicated port distinct
    # from the dev stack's 9092:9092 so a developer's already-running dev compose is never in conflict. The
    # scan-multi-target-e2e scenario's Kafka fault-injection needs the harness JVM (running on the host) to
    # bootstrap directly against the PLAINTEXT_HOST listener.
    ports:
      - "19092:19092"
    environment:
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092

  kafka-ui:
    ports: !override []

  zipkin:
    # Dedicated e2e-only host port, distinct from the dev stack's 9411:9411, so the harness JVM (running on the
    # host) can query Zipkin's API directly to prove trace continuity (see TemporalRiftSystemIT).
    ports: !override
      - "127.0.0.1:19411:9411"

  victorialogs:
    ports: !override
      - "127.0.0.1:15341:9428"
      - "127.0.0.1:22201:514"

  kafka-exporter:
    # Dedicated e2e-only host port, distinct from the dev stack's 9308:9308, so the harness JVM (running on the
    # host) can poll it directly to prove dead-letter traffic reaches the exporter (see TemporalRiftSystemIT).
    ports: !override
      - "127.0.0.1:19308:9308"

  victoriametrics:
    ports: !override []

  grafana:
    ports: !override []

  alertmanager:
    ports: !override []

  vmalert:
    ports: !override []

  e2e-auth:
    image: nginx:1.27-alpine
    volumes:
      - ./src/test/resources/oidc/public:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/.well-known/openid-configuration"]
      interval: 2s
      timeout: 2s
      retries: 20

  game-service:
    ports: !override
      - "18080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker,e2e
      JWT_ISSUER_URI: http://e2e-auth
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://e2e-auth/jwks.json
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: DEBUG
    depends_on:
      e2e-auth:
        condition: service_healthy
    logging:
      options:
        syslog-address: tcp://127.0.0.1:22201

  read-service:
    ports: !override
      - "18082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: e2e
      JWT_ISSUER_URI: http://e2e-auth
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://e2e-auth/jwks.json
    depends_on:
      e2e-auth:
        condition: service_healthy
    logging:
      options:
        syslog-address: tcp://127.0.0.1:22201

  timeline-service:
    ports: !override []
    environment:
      SPRING_PROFILES_ACTIVE: e2e
      # Its gated Weaver-chain REST endpoint is an OAuth2 resource server like game-service's and
      # read-service's, so it needs the same test-only issuer -- without it, startup fails outright
      # (SecurityConfig's oauth2ResourceServer() unconditionally requires a working JWT decoder).
      JWT_ISSUER_URI: http://e2e-auth
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://e2e-auth/jwks.json
    depends_on:
      e2e-auth:
        condition: service_healthy
    logging:
      options:
        syslog-address: tcp://127.0.0.1:22201
