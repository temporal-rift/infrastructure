services:
  postgres:
    ports: !override []
    # Default postgres:16-alpine fsyncs and waits for the WAL to hit disk on every commit
    # (synchronous_commit=on). On a real SSD that's sub-millisecond; on shared/throttled CI
    # storage it can silently stall for seconds at a time under concurrent write load from three
    # services' Kafka consumers all committing at once -- with zero error logged, since it's not
    # a failure, just a slow fsync. This container holds only ephemeral e2e test data with no
    # durability requirement (torn down every run), so trading crash-safety for speed here is
    # safe in a way it would not be for any real deployment.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]

  kafka:
    # Exposed only for this e2e profile (never the shared dev compose.yml), on a dedicated port distinct
    # from the dev stack's 9092:9092 so a developer's already-running dev compose is never in conflict. The
    # scan-multi-target-e2e scenario's Kafka fault-injection needs the harness JVM (running on the host) to
    # bootstrap directly against the PLAINTEXT_HOST listener.
    ports:
      - "19092:19092"
    environment:
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092

  kafka-ui:
    ports: !override []

  zipkin:
    ports: !override []

  victorialogs:
    ports: !override
      - "127.0.0.1:15341:9428"
      - "127.0.0.1:22201:514"

  e2e-auth:
    image: nginx:1.27-alpine
    volumes:
      - ./src/test/resources/oidc/public:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/.well-known/openid-configuration"]
      interval: 2s
      timeout: 2s
      retries: 20

  game-service:
    ports: !override
      - "18080:8080"
    environment:
      JWT_ISSUER_URI: http://e2e-auth
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://e2e-auth/jwks.json
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: DEBUG
      # max-eras: 2 keeps the game-ended lifecycle scenario within the e2e time budget -- it needs the
      # game to reach a terminal state (win, collapse, or stabilization), not to actually play out all
      # five production eras of real card combat.
      # card-grade-weights biases forced deals toward grade II/III (default is I:60,II:30,III:10) so the
      # scan-multi-target scenario's forced SCAN reliably resolves at a grade that can target more than one
      # event, without retrying across games/eras (single-grade cards are unaffected in kind).
      SPRING_APPLICATION_JSON: >-
        {"game":{"rate-limit":{"requests-per-minute":1000},"rules":{"action-round-timer-seconds":{"3":8,"4":8,"5":8},"hand-selection-timer-seconds":{"3":60,"4":45,"5":30},"hand-deal-forced-types":["TRACE","NULLIFY","SCAN","STALL"],"card-grade-weights":{"I":10,"II":50,"III":40},"max-eras":2}}}
    depends_on:
      e2e-auth:
        condition: service_healthy
    logging:
      options:
        syslog-address: tcp://127.0.0.1:22201

  read-service:
    ports: !override
      - "18082:8080"
    environment:
      JWT_ISSUER_URI: http://e2e-auth
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://e2e-auth/jwks.json
    depends_on:
      e2e-auth:
        condition: service_healthy
    logging:
      options:
        syslog-address: tcp://127.0.0.1:22201

  timeline-service:
    ports: !override []
    environment:
      # Paradoxes are opportunistic in the game-ended lifecycle scenario (it doesn't force or avoid them),
      # and an unresolved paradox force-cascades only after this timer expires. Up to three events can each
      # open their own resolution phase in reveal order, so the 60s production default could
      # serialize past this scenario's per-transition await budget; shortening it here matches game-service's
      # own e2e-only round/hand-selection timer overrides.
      SPRING_APPLICATION_JSON: >-
        {"game":{"rules":{"paradox-resolution-timer-seconds":5}}}
    logging:
      options:
        syslog-address: tcp://127.0.0.1:22201
