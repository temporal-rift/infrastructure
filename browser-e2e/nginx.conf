# Same-origin player entry point for the browser-e2e Compose deployment (docker-compose.e2e.yml).
# Adapted from playtest/nginx.conf: the only difference is serving the static client from a shared
# volume the one-shot web-client service populates (its own immutable, runtime-configured image),
# instead of a host-built dist/ bind-mounted directly -- compose.playtest.yml's real deployment
# still bind-mounts dist/ directly and must not be affected by this file.
#
# - Serves the static client from the shared volume web-client (a one-shot service, not a live
#   network participant -- proxying through a second nginx just to serve static files would be a
#   redundant hop) populates at container start.
# - Proxies /api/ to the owning service by longest-prefix match: player state/history reads to
#   read-service, chain reads to timeline-service, everything else gameplay-related to
#   game-service.
# - Live /ws/ notifications proxy to the single read-service instance; authenticated polling is
#   the authoritative recovery path.
# - Diagnostic and privileged surfaces are never proxied: they are unavailable through the player
#   origin by construction.

events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  upstream e2e-game {
    server game-service:8080;
  }

  upstream e2e-read {
    server read-service:8080;
  }

  upstream e2e-timeline {
    server timeline-service:8080;
  }

  # Plain HTTP exists only to redirect to HTTPS.
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/tls/gateway-cert.pem;
    ssl_certificate_key /etc/nginx/tls/gateway-key.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Gateway's own liveness probe. Upstream /actuator/* paths are never proxied through this
    # entry point.
    location = /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # The client checks this exact path before displaying sign-in. An internal subrequest gates a
    # fixed response on gameplay health; the upstream body and every other actuator path remain
    # unavailable to players.
    location = /actuator/health {
      auth_request /_gameplay_health;
      root /etc/nginx;
      try_files /readiness.json =503;
      default_type application/json;
    }

    location = /_gameplay_health {
      internal;
      proxy_pass http://e2e-game/actuator/health;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }

    # Privileged and diagnostic paths fail closed through the player origin.
    location ~ ^/(actuator|prometheus|metrics)(/|$) {
      return 404;
    }

    # Entitled player state/history reads belong to read-service. These regex locations take
    # precedence over the generic /api/ prefix below.
    location ~ ^/api/v1/games/[^/]+/state$ {
      proxy_pass http://e2e-read;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/v1/games/[^/]+/history$ {
      proxy_pass http://e2e-read;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Gated chain reads belong to timeline-service.
    location ~ ^/api/v1/games/[^/]+/chains {
      proxy_pass http://e2e-timeline;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Live notifications ride the single read-service instance. Polling the state endpoints above
    # remains the authoritative recovery path.
    location ^~ /ws/ {
      proxy_pass http://e2e-read;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # All other gameplay APIs (lobbies, hand selection, actions, paradox resolution, scores)
    # belong to game-service. Plain prefix location (no ^~) so the regex locations above still
    # take precedence for their more specific paths.
    location /api/ {
      proxy_pass http://e2e-game;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static client with SPA fallback, served from the volume web-client populated at start.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
