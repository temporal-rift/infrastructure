# Same-origin player entry point for the isolated playtest deployment.
# Routing only: no game rules or visibility logic live here. Membership and
# perspective checks remain the owning services' responsibility.
#
# - Serves the prebuilt static browser client over HTTPS.
# - Proxies /api/ to the owning service by longest-prefix match:
#   player state/history reads to read-service, chain reads to
#   timeline-service, everything else gameplay-related to game-service.
# - Live /ws/ notifications proxy to the single read-service instance;
#   authenticated polling is the authoritative recovery path.
# - Diagnostic and privileged surfaces (observability UIs, Config Server,
#   Kafka UI, upstream actuator endpoints) are never proxied: they are
#   unavailable through the player origin by construction.

events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  upstream playtest-game {
    server game-service:8080;
  }

  upstream playtest-read {
    server read-service:8080;
  }

  upstream playtest-timeline {
    server timeline-service:8080;
  }

  # Plain HTTP exists only to redirect to HTTPS.
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Gateway's own liveness probe. Upstream /actuator/* paths are never
    # proxied through this entry point.
    location = /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # Privileged and diagnostic paths fail closed through the player origin.
    location ~ ^/(actuator|prometheus|metrics)(/|$) {
      return 404;
    }

    # Entitled player state/history reads belong to read-service. These
    # regex locations take precedence over the generic /api/ prefix below.
    location ~ ^/api/v1/games/[^/]+/state$ {
      proxy_pass http://playtest-read;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/v1/games/[^/]+/history$ {
      proxy_pass http://playtest-read;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Gated chain reads belong to timeline-service.
    location ~ ^/api/v1/games/[^/]+/chains {
      proxy_pass http://playtest-timeline;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Live notifications ride the single read-service instance. Polling the
    # state endpoints above remains the authoritative recovery path.
    location ^~ /ws/ {
      proxy_pass http://playtest-read;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # All other gameplay APIs (lobbies, hand selection, actions, paradox
    # resolution, scores) belong to game-service. This is a plain prefix
    # location (no ^~) so the regex locations above still take precedence
    # for their more specific paths.
    location /api/ {
      proxy_pass http://playtest-game;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static client with SPA fallback.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
