# An ordinary (non-simulation) game-service and timeline-service deployment for the workbench E2E, layered
# on compose.yml as project temporal-rift-wbe2e-ordinary. It sets no simulation mode, so control operations
# must be unavailable on it. Only the two services the proof calls are started; everything else is
# unpublished so no host port can collide with a developer's stack.
#
# Required environment: SIMULATION_OBSERVER_NETWORK (the shared network, for the issuer key set).

networks:
  workbench:
    external: true
    name: "${SIMULATION_OBSERVER_NETWORK:?SIMULATION_OBSERVER_NETWORK must name the shared workbench network}"

x-ordinary-service: &ordinary-service
  networks:
    default: {}
    workbench: {}
  logging: !override
    driver: json-file
  labels:
    com.temporal-rift.owner: workbench-e2e
  environment:
    JWT_ISSUER_URI: http://localhost:19000/default
    SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://issuer:8080/default/jwks
  depends_on:
    identity-provider: !reset null

services:
  postgres:
    ports: !override []
  kafka:
    ports: !override []
  kafka-ui:
    ports: !override []
  zipkin:
    ports: !override []
  kafka-exporter:
    ports: !override []
  config-server:
    ports: !override []
  victorialogs:
    ports: !override []
  victoriametrics:
    ports: !override []
  alertmanager:
    ports: !override []
  vmalert:
    ports: !override []
  identity-provider:
    profiles: [local-issuer]
  game-service:
    <<: *ordinary-service
    image: temporal-rift/sim-game-service:${SIMULATION_IMAGE_TAG:-local}
    ports: !override
      - "127.0.0.1:18300:8080"
  timeline-service:
    <<: *ordinary-service
    image: temporal-rift/sim-timeline-service:${SIMULATION_IMAGE_TAG:-local}
    ports: !override
      - "127.0.0.1:18301:8080"
  # Not started, but its dependency on the local issuer must not leave the project invalid.
  read-service:
    depends_on:
      identity-provider: !reset null
