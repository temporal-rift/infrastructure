# Served only to the Config Client whose spring.application.name is timeline-service, layered on top of
# application.yml's shared game.rules.probability namespace (which serves the floor and ceiling). Timeline-service
# binds these at startup and fails fast when a required key is absent from the combined served configuration.
game:
  rules:
    probability:
      momentum-bonus: 10
      rally-multiplier: 1.5
      thread-shift: 10
    paradox-resolution-timer-seconds: 120
  timers:
    paradox-resolution-sweep-interval: 1s
