# Served only to the Config Client whose spring.application.name is timeline-service, layered on top of
# application.yml's shared game.rules.probability namespace. Timeline-service binds these at startup and
# fails fast when a required key is absent, so every key its properties class requires must be present here.
game:
  rules:
    probability:
      floor: 0
      ceiling: 90
      momentum-bonus: 10
      rally-multiplier: 1.5
      thread-shift: 10
    paradox-resolution-timer-seconds: 60
  timers:
    paradox-resolution-sweep-interval: 1s
