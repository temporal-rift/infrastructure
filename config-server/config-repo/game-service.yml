# Served only to the Config Client whose spring.application.name is game-service, layered on top of
# application.yml's shared game rules.
game:
  rate-limit:
    requests-per-minute: 120
    cleanup-interval: 60s
  request-body-limit:
    max-bytes: 1048576
  timers:
    event-resubmit-min-age: 2m
    event-resubmit-interval: 30s
    action-round-sweep-interval: 1s
    hand-selection-sweep-interval: 1s
    reconnect-sweep-interval: 1s
    scoring-completion-sweep-interval: 1s
    era-saga-scores-updated-sweep-interval: 1s
  rules:
    min-players: 3
    max-players: 5
    max-cascaded-paradoxes: 3
    # Keyed by player count: one event per player keeps every event equally contested at any table size.
    events-per-era:
      3: 3
      4: 4
      5: 5
    cards-per-hand: 5
    cards-per-deal: 7
    win-score-threshold: 20
    annihilate-earliest-round: 2
    # weaver-chain-length is shared with timeline-service and served from application.yml.
    victory:
      eraser-annihilations: 4
      prophet-written-resolutions: 3
      # Table sizes whose Prophet and Revisionist objectives differ from the values on their own line, keyed by player count.
      prophet-written-resolutions-by-player-count:
        5: 3
      revisionist-successful-eras: 3
      revisionist-successful-eras-by-player-count:
        5: 3
      activist-consecutive-declarations: 3
      # Off at 0: every objective needs its full steps even in the final era.
      final-era-objective-discount: 0
      # On: the highest total among simultaneous qualifiers wins alone; tied special endings go to objective progress.
      score-tiebreak: true
    seal-max-uses-per-game: 2
    reconnect-grace-period-seconds: 30
    action-round-timer-seconds:
      3: 180
      4: 180
      5: 180
    hand-selection-timer-seconds: 300
    declaration-timer-seconds:
      3: 120
      4: 120
      5: 120
    card-category-weights:
      PROBABILITY_SHIFTER: 35
      INFORMATION: 25
      DISRUPTION: 25
      PARADOX: 15
    card-grade-weights:
      I: 60
      II: 30
      III: 10
    stabilization:
      # Off: five eras without a winner go to the highest score. On restores the Prophet and Weaver claims below.
      faction-claims: false
      prophet-written-resolutions: 3
      weaver-active-chain-links: 2
    once-era-budgeted-specials:
      - ANNIHILATE
      - SEAL
      - CORRUPT
      - MIMIC
      - REWEAVE
      - REWRITE
    hand-deal-forced-types: []
    scoring:
      written-outcome-shields-annihilation: true
      expose-requires-declared-event: true
      annihilation-requires-consequence: true
      # On: a declaration or Rewrite whose outcome was annihilated that era is void, neither a win nor a miss.
      erased-outcome-voids-bets: true
      score-deltas:
        ANNIHILATED_OUTCOME: 3
        CORRUPTED_OPPONENT_CARD: 2
        EVENT_RESOLVED_AS_WRITTEN: 4
        FULFILLMENT_SUCCEEDED: 8
        EVENT_RESOLVED_DIFFERENTLY_THAN_WRITTEN: -2
        SECRET_OUTCOME_WON: 4
        SECRET_OUTCOME_MISSED: -1
        MIMIC_NEVER_TRACED: 4
        MIMIC_CONTRIBUTED_TO_WIN: 1
        CHAIN_LINK_ADDED: 2
        CHAIN_COMPLETED: 10
        CHAIN_BROKEN: -3
        # A Thread whose event resolved with another winner; 0 turns the cost off.
        CHAIN_LINK_MISSED: -1
        DECLARED_OUTCOME_WON_WITH_RALLY: 6
        DECLARED_OUTCOME_WON: 5
        EXPOSE_SIGNATURE_REVEALED: 2
        PARADOX_CASCADE_PENALTY: -2
        DECLARED_OUTCOME_MISSED_WITH_RALLY: -2
        DECLARED_OUTCOME_MISSED: -1
        # Clearing a paradox is free; tearing time costs the detonator.
        PARADOX_STABILIZED: 0
        PARADOX_DETONATED: -1
        # Reserve dial, off: a negative value charges a leading erasure that changed no winner.
        ANNIHILATION_WASTED: 0
