# Served only to the Config Client whose spring.application.name is game-service, layered on top of
# application.yml's shared game rules.
game:
  rate-limit:
    requests-per-minute: 120
    cleanup-interval: 60s
  request-body-limit:
    max-bytes: 1048576
  timers:
    event-resubmit-min-age: 2m
    event-resubmit-interval: 30s
    action-round-sweep-interval: 1s
    hand-selection-sweep-interval: 1s
    reconnect-sweep-interval: 1s
    scoring-completion-sweep-interval: 1s
    era-saga-scores-updated-sweep-interval: 1s
  rules:
    min-players: 3
    max-players: 5
    max-cascaded-paradoxes: 3
    events-per-era: 3
    cards-per-hand: 5
    cards-per-deal: 7
    win-score-threshold: 20
    reconnect-grace-period-seconds: 30
    action-round-timer-seconds:
      3: 60
      4: 45
      5: 30
    hand-selection-timer-seconds: 120
    card-category-weights:
      PROBABILITY_SHIFTER: 35
      INFORMATION: 25
      DISRUPTION: 25
      PARADOX: 15
    card-grade-weights:
      I: 60
      II: 30
      III: 10
    stabilization:
      prophet-written-resolutions: 3
      weaver-active-chain-links: 2
    once-era-budgeted-specials:
      - ANNIHILATE
      - SEAL
      - CORRUPT
      - MIMIC
      - REWEAVE
    hand-deal-forced-types: []
    scoring:
      score-deltas:
        ANNIHILATED_OUTCOME: 3
        CORRUPTED_OPPONENT_CARD: 2
        EVENT_RESOLVED_AS_WRITTEN: 4
        FULFILLMENT_SUCCEEDED: 8
        EVENT_RESOLVED_DIFFERENTLY_THAN_WRITTEN: -2
        SECRET_OUTCOME_WON: 4
        MIMIC_NEVER_TRACED: 6
        MIMIC_CONTRIBUTED_TO_WIN: 2
        CHAIN_LINK_ADDED: 2
        CHAIN_COMPLETED: 10
        CHAIN_BROKEN: -3
        DECLARED_OUTCOME_WON_WITH_RALLY: 6
        DECLARED_OUTCOME_WON: 5
        EXPOSE_SIGNATURE_REVEALED: 2
        PARADOX_CASCADE_PENALTY: -2
