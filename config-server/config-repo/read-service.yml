# Served only to the Config Client whose spring.application.name is read-service. read-service no longer
# hard-codes these values in its own application.yml; this is the one served copy.
notification:
  websocket:
    allowed-origins: ${NOTIFICATION_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:*}
    send-time-limit: 10s
    send-buffer-size: 512KB
    max-pending-messages: 256
