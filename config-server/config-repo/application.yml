# Shared cross-service configuration served to every Config Client application/profile that has no more
# specific override. game-service and read-service share max-eras; game-service and timeline-service share
# the game.rules.probability namespace, the Weaver chain length (game-service's objective, timeline-service's
# chain completion), the faction-bet window, the Foresight writing cap and the paradox contest
# (timeline-service decides the cascade, game-service scores it). Each service binds only the values it needs,
# so there is one served copy of each rule rather than one per consuming service.
game:
  rules:
    max-eras: 5
    # Latest round in which faction bets close: Thread, Reweave, Rewrite and Fulfillment are accepted in rounds
    # 1 through this round, and a Foresight played later previews but writes nothing.
    faction-bet-latest-round: 2
    victory:
      weaver-chain-length: 4
    paradox:
      # On: a paradox clears only when its distinct stabilizers are at least its distinct detonators, and a
      # cascade costs each detonator PARADOX_DETONATED on top of the base penalty every player pays.
      detonate-contests-stabilize: true
    foresight:
      writings-per-era: 1
    probability:
      floor: 0
      ceiling: 90
      push-shift:
        I: 10
        II: 20
        III: 30
      suppress-shift:
        I: -10
        II: -20
        III: -30
      swing-shift:
        I: 15
        II: 30
        III: 45
      amplify-multiplier:
        I: 1.5
        II: 2.0
        III: 3.0
      band-low-max: 30
      band-medium-max: 60
