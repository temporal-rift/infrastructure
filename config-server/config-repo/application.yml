# Shared cross-service configuration served to every Config Client application/profile that has no more
# specific override. game-service and timeline-service both bind this same game.rules.probability namespace
# directly — each service's own @ConfigurationProperties class only declares the fields it needs, so there is
# exactly one copy of these values, not one per consuming service.
game:
  rules:
    probability:
      push-shift:
        I: 10
        II: 20
        III: 30
      suppress-shift:
        I: -10
        II: -20
        III: -30
      swing-shift:
        I: 15
        II: 30
        III: 45
      amplify-multiplier:
        I: 1.5
        II: 2.0
        III: 3.0
      band-low-max: 30
      band-medium-max: 60
