# Shared cross-service configuration served to every Config Client application/profile that has no more
# specific override. game-service and read-service share max-eras; game-service and timeline-service share
# the game.rules.probability namespace. Each service binds only the values it needs, so there is one served
# copy of each rule rather than one per consuming service.
game:
  rules:
    max-eras: 5
    probability:
      push-shift:
        I: 10
        II: 20
        III: 30
      suppress-shift:
        I: -10
        II: -20
        III: -30
      swing-shift:
        I: 15
        II: 30
        III: 45
      amplify-multiplier:
        I: 1.5
        II: 2.0
        III: 3.0
      band-low-max: 30
      band-medium-max: 60
