name: CI

# Fast compile/format sanity check for the temporal-rift-system-tests module (this repository's root
# pom): no Docker, no profile, just `mvn verify`. This module's only tests are Failsafe *IT classes
# gated behind the e2e/security-e2e/browser-e2e profiles, so a plain `mvn verify` here executes zero
# tests and produces no meaningful coverage — the SonarCloud CI-based scan runs from system-e2e.yml
# instead, where the real Failsafe suite actually executes against this module's code. This workflow
# exists only for a quick compile-error signal ahead of that ~45-minute run.

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@ba34de01b7f4ba2ab8e2860df8993a29f4477056 # v1.20.0
        with:
          java-version: 26
          java-distribution: temurin
          maven-version: 3.9.13
          settings-githubServer: false
          checkout-enabled: false

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-build-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-build-

      - name: Build
        run: mvn --batch-mode verify
