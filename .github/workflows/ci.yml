name: CI

# Compile check and SonarCloud analysis for the temporal-rift-system-tests module (this repository's root pom): no
# Docker, no profile, just `mvn verify`. Harness unit tests run here; browser and system Failsafe *IT classes are
# gated behind the end-to-end profiles, which run when an epic closes (epic-e2e.yml). `sonar.coverage.exclusions=**/*` keeps this
# black-box harness out of the coverage metric, so the scan here reports code smells, bugs, and security findings.

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # SonarCloud's pull-request analysis diffs against the base branch's history.
          fetch-depth: 0

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@ba34de01b7f4ba2ab8e2860df8993a29f4477056 # v1.20.0
        with:
          java-version: 26
          java-distribution: temurin
          maven-version: 4.0.0-rc-7
          settings-githubServer: false
          checkout-enabled: false
          settings-servers: |
            [
              {
                "id": "github",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
              }
            ]

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-build-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-build-

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PR_KEY: ${{ github.event.pull_request.number }}
          SONAR_PR_BRANCH: ${{ github.head_ref }}
          SONAR_PR_BASE: ${{ github.base_ref }}
        run: |
          GOALS=(--batch-mode verify sonar:sonar)
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            GOALS+=(
              "-Dsonar.pullrequest.key=$SONAR_PR_KEY"
              "-Dsonar.pullrequest.branch=$SONAR_PR_BRANCH"
              "-Dsonar.pullrequest.base=$SONAR_PR_BASE"
            )
          fi
          mvn "${GOALS[@]}"
