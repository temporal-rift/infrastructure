name: Browser E2E

# Runs the real-browser deployed-play proof (docker-compose.e2e.yml, infrastructure#47): isolated,
# separately authenticated Playwright browser contexts driving the actual game-client bundle
# against a declarative Compose deployment of the whole system under test, under accelerated,
# explicitly labeled test-override timing. Independent of system-e2e.yml and security-e2e.yml.
#
# Unlike system-e2e.yml and security-e2e.yml, this does NOT run on every pull_request: building
# five container images and a complete multi-round game lifecycle make it far slower than either.
# It runs only when a PR carries the `run-browser-e2e` label (add the label, or re-push once it's
# already there, to opt that PR in), via manual workflow_dispatch, or via another workflow's
# workflow_call.
#
# Needs a fourth sibling checkout system-e2e.yml does not: game-client, whose image this
# deployment serves as web-client.

on:
  workflow_call:
    inputs:
      service:
        description: >-
          Repository name of the service/client under test (game-client, game-service,
          timeline-service or read-service). Omit to run every repository at its default branch.
        required: false
        type: string
        default: ''
      ref:
        description: Ref of the service/client under test. Ignored unless `service` is set.
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      service:
        description: >-
          Service/client under test. Leave as `all` to run every repository at its default branch.
        required: false
        type: choice
        default: all
        options:
          - all
          - game-client
          - game-service
          - timeline-service
          - read-service
      ref:
        description: Ref of the service/client under test. Required unless `service` is `all`.
        required: false
        type: string
        default: ''
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]

permissions:
  contents: read

concurrency:
  # One browser proof at a time per triggering ref -- the deployment holds a fixed Compose project
  # name and network aliases.
  group: browser-e2e-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    # ~9 min build/start-up plus four full games at ~5 min each.
    timeout-minutes: 45
    # Every pull_request event reaches this job (see the `types` list above, needed so a label
    # added after the PR is open still triggers a run) but only actually executes it when the PR
    # carries the opt-in label, or the run came from workflow_dispatch/workflow_call instead.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-browser-e2e')

    steps:
      - name: Validate service/ref inputs
        if: (inputs.service != '' && inputs.service != 'all' && inputs.ref == '') || ((inputs.service == '' || inputs.service == 'all') && inputs.ref != '')
        run: |
          echo "::error::service='${INPUT_SERVICE}' and ref='${INPUT_REF}' must be given together -- otherwise every repository silently runs at 'main' and the ref under test is never built."
          exit 1
        env:
          INPUT_SERVICE: ${{ inputs.service }}
          INPUT_REF: ${{ inputs.ref }}

      - name: Check out infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: temporal-rift/infrastructure
          ref: ${{ github.repository == 'temporal-rift/infrastructure' && github.sha || 'main' }}
          path: infrastructure
          persist-credentials: false

      - name: Check out game-client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: temporal-rift/game-client
          ref: ${{ inputs.service == 'game-client' && inputs.ref || 'main' }}
          path: game-client
          persist-credentials: false

      - name: Check out game-service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: temporal-rift/game-service
          ref: ${{ inputs.service == 'game-service' && inputs.ref || 'main' }}
          path: game-service
          persist-credentials: false

      - name: Check out timeline-service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: temporal-rift/timeline-service
          ref: ${{ inputs.service == 'timeline-service' && inputs.ref || 'main' }}
          path: timeline-service
          persist-credentials: false

      - name: Check out read-service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: temporal-rift/read-service
          ref: ${{ inputs.service == 'read-service' && inputs.ref || 'main' }}
          path: read-service
          persist-credentials: false

      - name: Report sources under test
        run: |
          echo "Service/client under test: ${INPUT_SERVICE:-<none — all repositories at default branch>}"
          for repo in infrastructure game-client game-service timeline-service read-service; do
            echo "$repo $(git -C "$repo" rev-parse --short HEAD)"
          done
        env:
          INPUT_SERVICE: ${{ inputs.service }}

      - name: Verify Docker Compose supports the depends_on model this deployment uses
        run: |
          version="$(docker compose version --short)"
          echo "docker compose $version"
          required=2.24.4
          if [ "$(printf '%s\n%s\n' "$required" "$version" | sort -V | head -n1)" != "$required" ]; then
            echo "::error::docker compose $version is older than the required $required"
            exit 1
          fi

      - name: Build service images
        id: build
        run: |
          game_service_tag="$(git -C game-service rev-parse --short HEAD)"
          timeline_service_tag="$(git -C timeline-service rev-parse --short HEAD)"
          read_service_tag="$(git -C read-service rev-parse --short HEAD)"
          web_client_tag="$(git -C game-client rev-parse --short HEAD)"

          docker build -t "temporal-rift/game-service:${game_service_tag}" ./game-service
          docker build -t "temporal-rift/timeline-service:${timeline_service_tag}" ./timeline-service
          docker build -t "temporal-rift/read-service:${read_service_tag}" ./read-service
          docker build -t "temporal-rift/web-client:${web_client_tag}" ./game-client

          {
            echo "game_service_tag=${game_service_tag}"
            echo "timeline_service_tag=${timeline_service_tag}"
            echo "read_service_tag=${read_service_tag}"
            echo "web_client_tag=${web_client_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Bring up the browser-e2e deployment
        id: up
        working-directory: infrastructure
        env:
          GAME_SERVICE_TAG: ${{ steps.build.outputs.game_service_tag }}
          TIMELINE_SERVICE_TAG: ${{ steps.build.outputs.timeline_service_tag }}
          READ_SERVICE_TAG: ${{ steps.build.outputs.read_service_tag }}
          WEB_CLIENT_TAG: ${{ steps.build.outputs.web_client_tag }}
        # --wait blocks here until every started service reaches its target condition (healthy, or
        # completed for one-shots) and fails this step with a clear message naming which one
        # didn't -- without it, `up -d` returns as soon as containers merely start, and any real
        # problem only surfaces later, opaquely, inside `run --rm e2e-tests`.
        # Bind-mount sources Docker has to create itself end up root-owned, which would block the
        # diagnostics step from writing under target/.
        run: |
          mkdir -p target/browser-e2e-manifest target/browser-e2e-traces target/browser-e2e-diagnostics
          docker compose -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 300

      - name: Show container status
        if: failure() && steps.up.outcome == 'failure'
        working-directory: infrastructure
        env:
          GAME_SERVICE_TAG: ${{ steps.build.outputs.game_service_tag }}
          TIMELINE_SERVICE_TAG: ${{ steps.build.outputs.timeline_service_tag }}
          READ_SERVICE_TAG: ${{ steps.build.outputs.read_service_tag }}
          WEB_CLIENT_TAG: ${{ steps.build.outputs.web_client_tag }}
        run: |
          docker compose -f docker-compose.e2e.yml ps --all
          docker compose -f docker-compose.e2e.yml logs --no-color --timestamps --tail=200

      - name: Run browser E2E
        id: test
        working-directory: infrastructure
        env:
          GAME_SERVICE_TAG: ${{ steps.build.outputs.game_service_tag }}
          TIMELINE_SERVICE_TAG: ${{ steps.build.outputs.timeline_service_tag }}
          READ_SERVICE_TAG: ${{ steps.build.outputs.read_service_tag }}
          WEB_CLIENT_TAG: ${{ steps.build.outputs.web_client_tag }}
        run: docker compose -f docker-compose.e2e.yml --profile test run --rm e2e-tests

      - name: Capture diagnostics
        if: failure() || cancelled()
        working-directory: infrastructure
        env:
          GAME_SERVICE_TAG: ${{ steps.build.outputs.game_service_tag || 'unused' }}
          TIMELINE_SERVICE_TAG: ${{ steps.build.outputs.timeline_service_tag || 'unused' }}
          READ_SERVICE_TAG: ${{ steps.build.outputs.read_service_tag || 'unused' }}
          WEB_CLIENT_TAG: ${{ steps.build.outputs.web_client_tag || 'unused' }}
        run: bash scripts/capture-browser-e2e-diagnostics.sh

      - name: Upload diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: infrastructure/target/browser-e2e-diagnostics
          retention-days: 14
          if-no-files-found: warn

      - name: Tear down the browser-e2e deployment
        if: always()
        working-directory: infrastructure
        env:
          GAME_SERVICE_TAG: ${{ steps.build.outputs.game_service_tag || 'unused' }}
          TIMELINE_SERVICE_TAG: ${{ steps.build.outputs.timeline_service_tag || 'unused' }}
          READ_SERVICE_TAG: ${{ steps.build.outputs.read_service_tag || 'unused' }}
          WEB_CLIENT_TAG: ${{ steps.build.outputs.web_client_tag || 'unused' }}
        run: docker compose -f docker-compose.e2e.yml down -v
